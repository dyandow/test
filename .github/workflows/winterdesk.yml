name: WinterDesk (Mac app)

on:
  push:
    paths:
      - "winterdesk/**"
      - ".github/workflows/winterdesk.yml"
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, newest wins, so the download link always has the latest code.
concurrency:
  group: winterdesk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: winterdesk
    steps:
      - uses: actions/checkout@v4
      - name: Build WinterDesk.app
        run: ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinterDesk
          path: winterdesk/build/WinterDesk.zip
      - name: Publish as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete winterdesk-latest --yes --cleanup-tag || true
          gh release create winterdesk-latest build/WinterDesk.zip \
            --target "${{ github.sha }}" --prerelease \
            --title "WinterDesk (latest build)" \
            --notes "Download WinterDesk.zip below, unzip it, drag WinterDesk.app to Applications, then right-click it and choose Open the first time."
