name: Ticket watcher

# Each run checks every minute for ~25 minutes, then starts the next run itself, so checking is continuous
# (public repos get unlimited Actions minutes). GitHub's schedule is only a backup: it often runs hours late.
# The chain stops on its own once every watched game has been played.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: send whatever matches right now, even if already alerted"
        type: boolean
        default: false

concurrency:
  group: tickets
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets a run start the next one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tickets_state.json remembers which listings were already alerted, between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: tickets_state.json
          key: tickets-state-${{ github.run_id }}
          restore-keys: tickets-state-

      - name: Watch tickets
        env:
          NTFY_TOPIC: ${{ secrets.TICKETS_NTFY_TOPIC || secrets.NTFY_TOPIC }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TEST_MODE: ${{ inputs.test && '1' || '' }}
          LOOP_MINUTES: ${{ inputs.test && '0' || '25' }}
          INTERVAL_SECONDS: "60"
        run: python -m tickets.check

      - name: Save state
        if: always() && !inputs.test
        uses: actions/cache/save@v4
        with:
          path: tickets_state.json
          key: tickets-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start the next run
        if: always() && !inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import sys; from tickets.check import any_live_watch; sys.exit(0 if any_live_watch() else 1)"; then
            gh workflow run tickets.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          else
            echo "No upcoming games to watch; not starting another run."
          fi
